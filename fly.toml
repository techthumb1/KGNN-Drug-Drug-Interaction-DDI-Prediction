# fly.toml app configuration file generated for kgnn-drug-drug-interaction-ddi-prediction-falling-sunset-9369 on 2025-05-12T20:22:51-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "kgnn-drug-drug-interaction-ddi-prediction-falling-sunset-9369"
primary_region = "dfw"

[build]

[env]
  FLASK_ENV = "production"
  ENABLE_PREDICTIONS = "true"
  PORT = "8080"
  OMP_NUM_THREADS = "1"
  MKL_NUM_THREADS = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "2048"                
  cpu_kind = "shared"
  cpus = 1
