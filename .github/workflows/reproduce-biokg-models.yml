name: Reproduce BioKG model artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/reproduce-biokg-models.yml
      - src/train/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biokg-model-reproduction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rgcn:
    name: Reproduce R-GCN and PGExplainer
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/biokg-trix-benchmark-relation-ranking'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-research.txt
          python -m pip check

      - name: Train and evaluate candidate on validation
        run: |
          python -u -m src.train.train_rgcn --steps 1000 --sparse-cpu --eval-batch-size 64 \
            --output models/rgcn_candidate.pt

      - name: Freeze validation-selected weights and evaluate on test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("models/rgcn_candidate.evaluation.json").read_text())["valid"]
          if not result["complete"] or result["mrr"] <= 0.148652:
              raise SystemExit("Candidate must beat the 100-step checkpoint on complete validation")
          PY
          python -u -m src.train.evaluate_checkpoint --checkpoint models/rgcn_candidate.pt \
            --selection-note "Frozen 1,000-step sparse CPU recipe selected on complete validation MRR" \
            --eval-batch-size 64 --output models/rgcn_v2.pt

      - name: Retrain and verify the checkpoint-bound explainer
        run: |
          python -u -m src.train.train_pgexplainer --epochs 50 --train-queries 128 --eval-queries 32 \
            --output models/pgexplainer.pt
          ENABLE_PREDICTIONS=true python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace

          from src.explain.explain_pg import load_artifact, model_digest
          from src.utils import model as runtime

          if runtime.prediction_error is not None:
              raise SystemExit(runtime.prediction_error)
          binding = SimpleNamespace(fingerprint=model_digest(runtime.model), contract=runtime.contract)
          load_artifact(binding, Path("models/pgexplainer.pt"))
          rows = runtime.rank_drug_relations(2733, 443)
          if len(rows) != 38:
              raise SystemExit("Expected all 38 BioKG drug-drug relations")
          PY

      - name: Upload evaluated model and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biokg-rgcn-reproduction
          if-no-files-found: warn
          path: |
            models/rgcn_candidate.evaluation.json
            models/rgcn_v2.pt
            models/rgcn_v2.evaluation.json
            models/pgexplainer.pt
            models/pgexplainer.evaluation.json
