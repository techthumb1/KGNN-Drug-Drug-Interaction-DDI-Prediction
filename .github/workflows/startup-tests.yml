name: Research demo regression tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python deployment/unpack_model.py "$RUNNER_TEMP/biokg-serving"

      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - run: python -m pip install -r requirements.txt

      - run: python -m pip check

      - run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm install --prefix /tmp/ddi-dom --no-package-lock jsdom@31.0.1 d3@7.9.2

      - run: NODE_PATH=/tmp/ddi-dom/node_modules node tests/test_graph_dom.cjs
