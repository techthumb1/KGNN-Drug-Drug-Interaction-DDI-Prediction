services:
  - type: web
    name: kgnn-ddi-app
    runtime: python
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && python prepare_runtime.py
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --timeout 600
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ENABLE_PREDICTIONS
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.12